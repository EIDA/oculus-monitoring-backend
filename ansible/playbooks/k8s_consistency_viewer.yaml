---
- name: Deploy consistency-viewer on k8s cluster
  hosts: localhost
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python
    oculus_namespace: eida-monitoring
    cv_app_name: oculus-consistency-viewer
    image: ghcr.io/eida/consistency-viewer:main
    replica_count: 1
    container_port: 80

  tasks:
    - name: Create Service for consistency-viewer
      kubernetes.core.k8s:
        namespace: "{{ oculus_namespace }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ cv_app_name }}-service"
            namespace: "{{ oculus_namespace }}"
          spec:
            selector:
              app: "{{ cv_app_name }}"
            ports:
              - protocol: TCP
                port: 80
                targetPort: "{{ container_port }}"
            type: ClusterIP

    - name: Create Ingress for consistency-viewer
      kubernetes.core.k8s:
        namespace: "{{ oculus_namespace }}"
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: "{{ cv_app_name }}-ingress"
            namespace: "{{ oculus_namespace }}"
          spec:
            rules:
              - host: "eida-oculus.orfeus-eu.org"
                http:
                  paths:
                    - path: /consistency-viewer
                      pathType: Prefix
                      backend:
                        service:
                          name: "{{ cv_app_name }}-service"
                          port:
                            number: 80

    - name: Create COnfigMap for nginx.conf
      kubernetes.core.k8s:
        state: present
        namespace: "{{ oculus_namespace }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ cv_app_name }}-nginx-config"
            namespace: "{{ oculus_namespace }}"
          data:
            default.conf: |
              server {
                listen 80;
                server_name _;

                location = /consistency-viewer {
                  return 301 /consistency-viewer/;
                }

                location = /consistency-viewer/ {
                  return 302 /consistency-viewer/viewer.html;
                }

                location ^~ /consistency-viewer/ {
                  alias /usr/share/nginx/html/;
                }
              }

    - name: Create CronJob for copy reports
      kubernetes.core.k8s:
        state: present
        namespace: "{{ oculus_namespace }}"
        definition:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: "{{ cv_app_name }}-copy-reports"
            namespace: "{{ oculus_namespace }}"
          spec:
            schedule: "0 20 * * 0" # every sundy at 20h (8pm)
            jobTemplate:
              spec:
                template:
                  spec:
                    restartPolicy: OnFailure
                    containers:
                      - name: copy-reports
                        image: alpine:latest
                        command:
                          - /bin/sh
                          - -c
                          - cp -a /data/reports/. /usr/share/nginx/html/
                        volumeMounts:
                          - name: scratch
                            mountPath: /data
                          - name: scratch
                            mountPath: /usr/share/nginx/html
                            subPath: viewer-html
                    volumes:
                      - name: scratch
                        persistentVolumeClaim:
                          claimName: oculus-consistency

    - name: Create deployement for consitency-viewer
      kubernetes.core.k8s:
        namespace: "{{ oculus_namespace }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ cv_app_name }}"
            namespace: "{{ oculus_namespace }}"
          spec:
            replicas: "{{ replica_count }}"
            selector:
              matchLabels:
                app: "{{ cv_app_name }}"
            template:
              metadata:
                labels:
                  app: "{{ cv_app_name }}"
              spec:
                volumes:
                  - name: nginx-config
                    configMap:
                      name: "{{ cv_app_name }}-nginx-config"
                  - name: scratch
                    persistentVolumeClaim:
                      claimName: oculus-consistency
                initContainers:
                  - name: initialize-viewer-html
                    image: "{{ image }}"
                    imagePullPolicy: Always
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -eux
                        ls -la /usr/share/nginx/html
                        find /usr/share/nginx/html -maxdepth 2 -type f -print
                        test -f /usr/share/nginx/html/viewer.html
                        mkdir -p /shared/viewer-html
                        cp -a /usr/share/nginx/html/. /shared/viewer-html/
                        ls -la /shared/viewer-html
                    volumeMounts:
                      - name: scratch
                        mountPath: /shared
                containers:
                  - name: "{{ cv_app_name }}"
                    image: "{{ image }}"
                    imagePullPolicy: Always
                    ports:
                      - containerPort: "{{ container_port }}"
                    volumeMounts:
                      - name: scratch
                        mountPath: /usr/share/nginx/html
                        subPath: viewer-html
                        readOnly: true
                      - name: nginx-config
                        mountPath: /etc/nginx/conf.d/default.conf
                        subPath: default.conf
                    readinessProbe:
                      httpGet:
                        path: /consistency-viewer/viewer.html
                        port: "{{ container_port }}"
                    livenessProbe:
                      httpGet:
                        path: /consistency-viewer/viewer.html
                        port: "{{ container_port }}"
