---
node: AFAD
endpoint: deprem.afad.gov.tr
eidaRoutingFile: routing/routing.xml
fdsnRoutingFile: routing/routing.json
onlineCheck:
  net: TU
  sta: AKSY
  loc: --
  cha: HHZ
  start: "2026-08-01T00:00:00"
  end: "2026-08-01T00:00:05"
requiremets:
  network: TK
perfCheck:
  scenario:
    default: &default
      net: TU
      loc: "*"
      cha: "*"
      start: "2026-08-01T00:01:00"
      end: "2026-08-01T00:02:00"
    9streams: &scenar_9str
      <<: *default
      sta: "G*"
    54streams: &scenar_54str
      <<: *default
      sta: "K*,O*"
    320streams: &scenar_320str
      <<: *default
      net: TU
      sta: "*"
      cha: "HH?"
    1stream15days: &scenar_1str15days
      <<: *default
      sta: AKSY
      cha: HHZ
      start: "2026-08-01T00:00:00"
      end: "2026-08-16T00:00:00"
# dataselect
services:
- name: fdsnws/dataselect
  scenario: 9streams
  parameters:
    <<: *scenar_9str
- name: fdsnws/dataselect
  scenario: 54streams
  parameters:
    <<: *scenar_54str
- name: fdsnws/dataselect
  scenario: 320streams
  parameters:
    <<: *scenar_320str
- name: fdsnws/dataselect
  scenario: 1stream15days
  parameters:
    <<: *scenar_1str15days
# availability
- name: fdsnws/availability
  scenario: 9streams
  parameters:
    <<: *scenar_9str
- name: fdsnws/availability
  scenario: 54streams
  parameters:
    <<: *scenar_54str
- name: fdsnws/availability
  scenario: 320streams
  parameters:
    <<: *scenar_320str
- name: fdsnws/availability
  scenario: 1stream15days
  parameters:
    <<: *scenar_1str15days
# station
- name: fdsnws/station
  scenario: 9streams
  parameters:
    <<: *scenar_9str
- name: fdsnws/station
  scenario: 54streams
  parameters:
    <<: *scenar_54str
- name: fdsnws/station
  scenario: 320streams
  parameters:
    <<: *scenar_320str
- name: fdsnws/station
  scenario: 1stream15days
  parameters:
    <<: *scenar_1str15days
# wfcatalog
- name: eidaws/wfcatalog
  scenario: 9streams
  parameters:
    <<: *scenar_9str
- name: fdsnws/wfcatalog
  scenario: 54streams
  parameters:
    <<: *scenar_54str
- name: eidaws/wfcatalog
  scenario: 320streams
  parameters:
    <<: *scenar_320str
- name: eidaws/wfcatalog
  scenario: 1stream15days
  parameters:
    <<: *scenar_1str15days