<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EIDA Consistency — report viewer</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--mut:#656d76;--line:#d0d7de;--accent:#0969da;--card:#f6f8fa;--ok:#1a7f37;--warn:#8b4a00;--bad:#cf222e;--info:#8250df}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#8b949e;--line:#30363d;--accent:#4493f8;--card:#161b22;--ok:#6fdd7c;--warn:#d29922;--bad:#e5534b;--info:#a371f7}}
*{box-sizing:border-box}
/* Visible to screen readers only — used for column headings that are blank on
   screen because their cells label themselves. */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
body{font-family:Roboto,system-ui,sans-serif;margin:0;background:var(--bg);color:var(--fg);font-size:14px}
.wrap{max-width:1100px;margin:0 auto;padding:1.2rem}

/* summary header */
.summary{display:flex;flex-wrap:wrap;gap:1rem 1.6rem;align-items:center;padding-bottom:.9rem;border-bottom:1px solid var(--line)}
.summary h1{font-size:1.5rem;margin:0 0 .3rem}
.gauge svg{display:block}
.gtrack{fill:none;stroke:var(--line);stroke-width:6}
.gval{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .4s}
.gtext{fill:var(--fg);font-size:15px;font-weight:700}
.smeta{flex:1 1 auto;min-width:160px}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0}
.chip{font-size:.78rem;padding:.1rem .5rem;border-radius:999px;border:1px solid var(--line)}
.chip.bad{color:var(--bad)} .chip.ok{color:var(--ok)} .chip.mut{color:var(--mut)}
.ts{color:var(--mut);font-size:.8rem}
.dirs{display:flex;flex-direction:column;gap:.35rem;min-width:200px}
.dbar{display:flex;align-items:center;gap:.5rem;font-size:.82rem}
.dlab{width:104px;color:var(--mut)}
.dtrack{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.dfill{display:block;height:100%}
.dfill.up{background:var(--bad)} .dfill.down{background:var(--warn)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;padding:.8rem 0;position:sticky;top:0;background:var(--bg);z-index:1;border-bottom:1px solid var(--line)}
.toolbar input,.toolbar select{padding:.3rem .4rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.toolbar .hint{color:var(--mut);font-size:.78rem;margin-left:auto}

/* results table */
table.results{width:100%;border-collapse:collapse}
table.results th{color:var(--mut);font-weight:600;text-align:left;border-bottom:1px solid var(--line);padding:.4rem .6rem;white-space:nowrap}
table.results th.sortable{cursor:pointer;user-select:none}
table.results th.sortable:hover{color:var(--fg)}
table.results th.active{color:var(--fg)}
table.results td{border-bottom:1px solid var(--line);padding:.4rem .6rem}
table.results td.win{color:var(--mut);font-size:.85rem}
table.results tbody tr{cursor:pointer}
table.results tbody tr:hover{background:var(--card)}
table.results tbody tr.sel{background:var(--card);box-shadow:inset 3px 0 0 var(--accent)}
.badge{display:inline-block;min-width:1.4em;text-align:center;background:var(--bad);color:#fff;border-radius:999px;font-size:.75rem;padding:0 .35rem}
.tag{display:inline-block;font-size:.72rem;padding:.05rem .45rem;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tag.avail{color:var(--warn)} .tag.data{color:var(--bad)}
.verdict{font-weight:600;font-size:.85rem}
.verdict.bad{color:var(--bad)} .verdict.ok{color:var(--ok)} .verdict.mut{color:var(--mut)}
.chip.warn{color:var(--warn)} .chip.info{color:var(--info)} .chip.lbl{color:var(--mut);font-weight:600}
.psd{font-weight:600;letter-spacing:1px;white-space:nowrap}
.psd.ok{color:var(--ok)} .psd.bad{color:var(--bad)} .psd.warn{color:var(--warn)} .psd.mut{color:var(--mut)} .psd.info{color:var(--info)}
.psd-word.ok{color:var(--ok)} .psd-word.bad{color:var(--bad)} .psd-word.warn{color:var(--warn)}
.psd-word.mut{color:var(--mut)} .psd-word.info{color:var(--info)}
.psd-line{margin:.3rem 0 .1rem;font-size:.9rem} .psd-tri{font-weight:700;letter-spacing:1px;margin-right:.3rem}
.psd-meta{margin:0 0 .6rem;font-size:.82rem;color:var(--mut)}
.psd-meta a{color:var(--accent);text-decoration:none} .psd-meta a:hover{text-decoration:underline}
.mut{color:var(--mut)}
.psd-line.bad{color:var(--bad)} .psd-line.ok{color:var(--ok)} .psd-line.warn{color:var(--warn)} .psd-line.mut{color:var(--mut)} .psd-line.info{color:var(--info)}
.psd-legend{color:var(--mut);font-size:.8rem;line-height:1.5;margin:.6rem 0 .3rem;padding:.5rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.psd-legend b{color:var(--fg);font-weight:700}
.psd-legend .psd{margin:0 .1rem}
.psd-types{margin-top:.35rem;padding-top:.35rem;border-top:1px solid var(--line)}
.psd-word{font-size:.8rem;white-space:nowrap}
.epoch{font-size:.8rem;white-space:nowrap}
.epoch.live{color:var(--fg)} .epoch.ended{color:var(--mut)}
.explain{margin:.1rem 0 .7rem;font-size:.92rem;font-weight:500}
.explain.bad{color:var(--bad)} .explain.ok{color:var(--ok)} .explain.mut{color:var(--mut)}

/* detail */
.detail{margin-top:1rem;padding:.9rem 1rem;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.detail:empty{display:none}
.detail h2{font-size:.95rem;margin:.6rem 0 .3rem}
.tlsvg{width:100%;height:auto;display:block;max-width:920px;margin:.2rem 0 .4rem}
.tl-track{fill:var(--line);opacity:.5}
.tl-av{fill:var(--ok)}
.tl-ds{fill:var(--accent)}
.tl-gap{fill:var(--bad);opacity:.16}
.tl-gap-solid{fill:var(--bad);opacity:.85}
/* Gap bands carry a hatch as well as a tint, so they stay legible when red-green
   colour vision flattens --bad into the track grey. */
.tl-hatch-bg{fill:none}
.tl-hatch-line{stroke:var(--bad);stroke-width:2.5;opacity:.9}
.tl-gap-hatch{fill:url(#tl-hatch)}
.tl-axis{stroke:var(--line)}
.tl-lab,.tl-lane{fill:var(--mut);font-size:11px;font-family:Roboto,system-ui,sans-serif}
.tl{font-family:"Roboto Mono",ui-monospace,Menlo,monospace;font-size:13px;line-height:1.15;letter-spacing:0;margin:.1rem 0;white-space:pre;overflow-x:auto;color:var(--mut)}
.legend{color:var(--mut);font-size:.78rem;margin:.1rem 0 .7rem}
.legend .lg{font-family:"Roboto Mono",monospace}
.legend .lg.av{color:var(--ok)} .legend .lg.ds{color:var(--accent)} .legend .lg.gap{color:var(--bad)}
.req{margin:.3rem 0}
.req.full{font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:.25rem .5rem}
.reqitem{display:inline-flex;align-items:center;gap:.25rem;font-weight:400}
.req button{cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:.15rem .5rem;margin-right:.2rem}
.req button.copy{font-size:.75rem;color:var(--mut)}
.req a{color:var(--accent);margin-right:.4rem;text-decoration:none}
.gap{margin:.5rem 0 0;font-size:.9rem;border-top:1px dashed var(--line);padding-top:.5rem}
.ghead{margin-bottom:.25rem}
.gdur{color:var(--mut)}
.result{color:var(--mut)}
.badge-data{display:inline-block;margin-left:.4rem;padding:.06rem .5rem;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.04em;color:#fff;vertical-align:middle}
.badge-data.yes{background:var(--ok)}
.badge-data.no{background:var(--bad)}
.badge-data.err{background:var(--mut)}

/* landing / index / loader */
.index h1,.loader h1{font-size:1.4rem}
.ilist{list-style:none;padding:0}
.ilist li{padding:.5rem 0;border-bottom:1px solid var(--line);display:flex;gap:.6rem;align-items:baseline}
.ilist a{color:var(--accent);text-decoration:none;font-weight:600}
.iscore{font-weight:700}
.iscore.ok{color:var(--ok)} .iscore.warn{color:var(--warn)} .iscore.bad{color:var(--bad)}
.imeta{color:var(--mut);font-size:.82rem}
.loader{margin-top:1rem;max-width:640px}
.loadrow{display:flex;gap:.4rem}
.loader input[type=url]{flex:1;padding:.45rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.loader button{padding:.45rem .9rem;border:1px solid var(--line);border-radius:6px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
.drop{margin-top:.7rem;padding:1rem;border:1.5px dashed var(--line);border-radius:8px;color:var(--mut);text-align:center}
.drop.over{border-color:var(--accent);color:var(--fg);background:var(--card)}
.filebtn{color:var(--accent);cursor:pointer;text-decoration:underline}
</style></head>
<body><div class="wrap">
  <div id="summary"></div>
  <div class="toolbar" id="toolbar">
    <label><input type="checkbox" id="onlyInc" checked> only inconsistent</label>
    <select id="dir"><option value="both">all ▲▼</option><option value="dataselect">▲ Data only</option><option value="availability">▼ Avail only</option></select>
    <select id="psd"><option value="all">PSD: all</option><option value="consistent">▶ PSD consistent</option><option value="inconsistent">▶ PSD inconsistent (✖ ⚠)</option></select>
    <input id="search" placeholder="search NET.STA.CHA">
    <span class="hint">click a column header to sort</span>
  </div>
  <div id="results"></div>
  <div id="detail"></div>
</div>
<script type="module" src="viewer.js"></script>
</body></html>
